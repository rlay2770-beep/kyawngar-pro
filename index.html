<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script async src="https://www.tiktok.com/embed.js"></script>
  <style>
    @keyframes spin-disc { 100% { transform: rotate(360deg); } }
    .animate-spin-disc { animation: spin-disc 4s linear infinite; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-20">

  <!-- Header -->
  <header class="bg-white border-b sticky top-0 z-30 px-4 py-3 shadow-sm flex justify-between items-center">
    <h1 class="text-lg font-bold text-slate-900 flex items-center gap-2">
      <span>🌐</span> App Community
    </h1>
    <div id="userProfileArea" class="flex items-center gap-2">
      <button onclick="loginWithGoogle()" class="bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg font-medium">
        🔑 Google Login
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Post Creation Box -->
    <div class="bg-white p-4 rounded-xl border shadow-sm space-y-3">
      <h3 class="font-bold text-sm text-slate-700">📌 ပို့စ်အသစ်တင်ရန်</h3>
      <input type="text" id="postTitle" placeholder="ခေါင်းစဉ်" class="w-full border p-2 rounded-lg text-xs outline-none focus:ring-1 focus:ring-slate-400">
      <textarea id="postDesc" placeholder="အသေးစိတ် ရေးရန်..." class="w-full border p-2 rounded-lg text-xs outline-none focus:ring-1 focus:ring-slate-400 h-20"></textarea>
      
      <div class="grid grid-cols-2 gap-2 text-xs">
        <select id="postCat" class="border p-2 rounded-lg bg-white">
          <option value="feed">Feed</option>
          <option value="reels">Reels</option>
          <option value="ads">VIP Ads</option>
        </select>
        <input type="text" id="postSubCat" placeholder="Category tag (e.g. news)" class="border p-2 rounded-lg">
      </div>

      <input type="text" id="postImage" placeholder="Image URL..." class="w-full border p-2 rounded-lg text-xs">
      <input type="text" id="postVideo" placeholder="Video URL (YouTube / TikTok / MP4)..." class="w-full border p-2 rounded-lg text-xs">
      <input type="text" id="postAudio" placeholder="Audio URL (MP3)..." class="w-full border p-2 rounded-lg text-xs">

      <button onclick="createNewPost()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-xs transition">
        🚀 ပို့စ်တင်မည်
      </button>
    </div>

    <!-- Search & Filter -->
    <div class="space-y-2">
      <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="🔍 ရှာဖွေရန်..." class="w-full border p-2 rounded-lg text-xs bg-white shadow-sm">
      <div class="flex gap-2 overflow-x-auto py-1 text-xs no-scrollbar">
        <button onclick="filterTag('all')" class="bg-slate-800 text-white px-3 py-1 rounded-full whitespace-nowrap">All</button>
        <button onclick="filterTag('news')" class="bg-white border px-3 py-1 rounded-full whitespace-nowrap">News</button>
        <button onclick="filterTag('general')" class="bg-white border px-3 py-1 rounded-full whitespace-nowrap">General</button>
      </div>
    </div>

    <!-- Content Sections -->
    <div id="feedAds" class="space-y-3"></div>
    <div id="reelsAds" class="space-y-3"></div>
    <div id="paidAds" class="space-y-3"></div>

  </main>

  <!-- Modals & Containers -->
  <div id="chatModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-xl p-4 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="chatTargetName" class="font-bold text-sm">Direct Message</h3>
        <button onclick="closeChatModal()" class="text-slate-400 font-bold">✕</button>
      </div>
      <div id="chatMessages" class="h-60 overflow-y-auto space-y-2 text-xs p-1"></div>
      <form onsubmit="sendDirectMessage(event)" class="flex gap-2">
        <input type="text" id="chatInput" placeholder="စာရေးရန်..." class="flex-1 border p-2 rounded-lg text-xs outline-none">
        <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-bold">ပို့</button>
      </form>
    </div>
  </div>

  <div id="appealModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-xl p-4 space-y-3">
      <h3 class="font-bold text-sm">⚠️ အယူခံဝင်ရန်</h3>
      <textarea id="appealReason" placeholder="အကြောင်းပြချက် ရေးသားပါ..." class="w-full border p-2 rounded-lg text-xs h-24"></textarea>
      <div class="flex justify-end gap-2 text-xs">
        <button onclick="closeAppealModal()" class="px-3 py-1.5 border rounded-lg">မလုပ်တော့ပါ</button>
        <button onclick="submitAppeal()" class="px-3 py-1.5 bg-rose-600 text-white rounded-lg font-bold">တင်ပြမည်</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ မိမိ၏ Firebase Config အချက်အလက်များဖြင့် အစားထိုးပါ
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let isUserAdmin = false;
    let currentSearchQuery = "";
    let activeTag = "all";
    let activeChatUid = null;
    let activeAppealPostId = null;

    // Admin List
    const adminUids = ["YOUR_ADMIN_UID_1", "YOUR_ADMIN_UID_2"];

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      const profileArea = document.getElementById('userProfileArea');
      if (user) {
        isUserAdmin = adminUids.includes(user.uid);
        profileArea.innerHTML = `
          <img src="${user.photoURL || 'https://via.placeholder.com/32'}" class="w-8 h-8 rounded-full border">
          <button onclick="logout()" class="text-xs text-rose-500 font-bold bg-rose-50 px-2 py-1 rounded-lg">Logout</button>
        `;
      } else {
        isUserAdmin = false;
        profileArea.innerHTML = `
          <button onclick="loginWithGoogle()" class="bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg font-medium">🔑 Google Login</button>
        `;
      }
      loadPosts();
    });

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider);
    }

    function logout() {
      auth.signOut();
    }

    function createNewPost() {
      if (!currentUser) return alert("ကျေးဇူးပြု၍ Google Login အရင်ဝင်ပါ");
      
      const title = document.getElementById('postTitle').value;
      const description = document.getElementById('postDesc').value;
      const category = document.getElementById('postCat').value;
      const subCategory = document.getElementById('postSubCat').value || 'general';
      const imageUrl = document.getElementById('postImage').value;
      const videoUrl = document.getElementById('postVideo').value;
      const audioUrl = document.getElementById('postAudio').value;

      if (!title && !description && !imageUrl && !videoUrl && !audioUrl) {
        return alert("အနည်းဆုံး အချက်အလက် တစ်ခုခု ဖြည့်သွင်းပါ");
      }

      db.collection("posts").add({
        title,
        description,
        category,
        subCategory,
        imageUrl,
        videoUrl,
        audioUrl,
        authorUid: currentUser.uid,
        authorName: currentUser.displayName || 'Anonym',
        authorPhoto: currentUser.photoURL || '',
        status: 'active',
        likes: [],
        comments: [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById('postTitle').value = "";
        document.getElementById('postDesc').value = "";
        document.getElementById('postImage').value = "";
        document.getElementById('postVideo').value = "";
        document.getElementById('postAudio').value = "";
        alert("ပို့စ် အောင်မြင်စွာ တင်ပြီးပါပြီ");
      }).catch(err => alert(err.message));
    }
            // Helper Functions for Video URLs
    function getYoutubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function getTikTokId(url) {
      if (!url) return null;
      const match = url.match(/video\/(\d+)/);
      return match ? match[1] : null;
    }

    function loadPosts() {
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot(snapshot => {
        const posts = [];
        snapshot.forEach(doc => {
          posts.push({ id: doc.id, ...doc.data() });
        });
        renderAdsData(posts);
      });
    }

    function handleSearch(val) {
      currentSearchQuery = val.toLowerCase();
      loadPosts();
    }

    function filterTag(tag) {
      activeTag = tag;
      loadPosts();
    }

    // Main Data Renderer (Fixed & Working)
    function renderAdsData(ads) {
      let feedHtml = "", reelsHtml = "", paidHtml = "";

      const filtered = ads.filter(item => {
        const matchesSearch = !currentSearchQuery || 
          (item.title || "").toLowerCase().includes(currentSearchQuery) || 
          (item.description || "").toLowerCase().includes(currentSearchQuery);
        
        const matchesTag = (activeTag === "all") || (item.subCategory === activeTag);
        return matchesSearch && matchesTag;
      });

      filtered.forEach((data) => {
        const cat = data.category || 'feed';
        const likes = data.likes || [];
        const comments = data.comments || [];
        const isLiked = currentUser && likes.includes(currentUser.uid);
        const isOwner = currentUser && (currentUser.uid === data.authorUid);

        // Hidden Post Logic
        if (data.status === "hidden" && !isOwner && !isUserAdmin) {
          return;
        }

        let mediaTag = "";

        if (data.imageUrl) {
          mediaTag += `
            <div class="relative rounded-xl overflow-hidden mt-2 border bg-slate-900 group">
              <img src="${data.imageUrl}" class="w-full max-h-80 object-cover" loading="lazy">
              ${data.audioUrl ? `
                <div class="absolute bottom-2 left-2 right-2 bg-black/60 backdrop-blur-md rounded-lg p-2 flex items-center gap-2 border border-white/20">
                  <div class="w-6 h-6 rounded-full bg-slate-800 border border-white flex items-center justify-center animate-spin-disc text-[10px]">🎵</div>
                  <audio controls class="h-6 flex-1 scale-90 -ml-2" preload="none">
                    <source src="${data.audioUrl}" type="audio/mpeg">
                  </audio>
                </div>
              ` : ''}
            </div>
          `;
        } else if (data.audioUrl) {
          mediaTag += `
            <div class="mt-2 p-2 bg-purple-50 border border-purple-200 rounded-xl flex items-center gap-2">
              <span class="text-base">🎧</span>
              <audio controls class="w-full h-7" preload="none">
                <source src="${data.audioUrl}" type="audio/mpeg">
              </audio>
            </div>
          `;
        }

        if (data.videoUrl) {
          const ytId = getYoutubeId(data.videoUrl);
          const ttId = getTikTokId(data.videoUrl);

          if (ytId) {
            mediaTag += `
              <div class="mt-2 rounded-xl overflow-hidden border bg-black aspect-video">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen loading="lazy"></iframe>
              </div>`;
          } else if (ttId) {
            mediaTag += `
              <blockquote class="tiktok-embed mt-2" cite="${data.videoUrl}" data-video-id="${ttId}" style="max-width: 100%;">
                <section></section>
              </blockquote>`;
          } else if (data.videoUrl.endsWith('.mp4') || data.videoUrl.includes('.mp4')) {
            mediaTag += `
              <div class="mt-2 rounded-xl overflow-hidden border bg-black">
                <video controls preload="metadata" class="w-full max-h-80 object-cover">
                  <source src="${data.videoUrl}" type="video/mp4">
                </video>
              </div>`;
          } else {
            mediaTag += `
              <a href="${data.videoUrl}" target="_blank" class="mt-2 block p-2 bg-indigo-50 border border-indigo-100 rounded-lg text-xs text-indigo-700 truncate">
                🔗 ${data.videoUrl}
              </a>`;
          }
        }

        const authorName = data.authorName || 'unknown';
        const authorPhoto = data.authorPhoto ? `<img src="${data.authorPhoto}" onclick="openDirectChat('${data.authorUid}', '${authorName}')" class="w-6 h-6 rounded-full object-cover cursor-pointer" loading="lazy" title="Private Msg ပို့ရန် နှိပ်ပါ">` : `<div onclick="openDirectChat('${data.authorUid}', '${authorName}')" class="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-[10px] cursor-pointer" title="Private Msg ပို့ရန် နှိပ်ပါ">👤</div>`;
        
        const canDelete = currentUser && (currentUser.uid === data.authorUid || isUserAdmin);

        let commentsList = comments.slice(-2).map(c => `
          <div class="text-[11px] bg-slate-100 p-1.5 rounded flex items-start gap-1.5">
            <img src="${c.userPhoto || 'https://via.placeholder.com/20'}" onclick="openDirectChat('${c.userUid}', '${c.userName}')" class="w-4 h-4 rounded-full mt-0.5 object-cover cursor-pointer" loading="lazy">
            <div><span class="font-bold text-slate-700">@${c.userName}:</span> ${c.text}</div>
          </div>
        `).join('');

        let hiddenNotice = "";
        if (data.status === "hidden") {
          hiddenNotice = `
            <div class="bg-rose-50 border border-rose-200 p-2.5 rounded-lg text-xs text-rose-700 space-y-1">
              <p class="font-bold">⚠️ ကျွန်ုပ်တို့၏ လူမှုစံနှုန်းများနှင့် မညီညွတ်သောကြောင့် ဤပို့စ်အား အများမြင်ကွင်းမှ ဖျောက်ထားပါသည်။</p>
              <p class="text-[10px] text-rose-500">အကြောင်းအရင်း: ${data.hideReason || "စံနှုန်းမညီပါ"}</p>
              <button onclick="openAppealModal('${data.id}')" class="bg-rose-600 text-white text-[10px] font-bold px-2 py-1 rounded hover:bg-rose-700 transition">အယူခံဝင်မည်</button>
            </div>
          `;
        }

        const card = `
          <div class="bg-white border rounded-xl p-3 shadow-sm space-y-2">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                ${authorPhoto}
                <div>
                  <h4 class="font-bold text-slate-800 text-xs flex items-center gap-1">
                    @${authorName}
                    <button onclick="openDirectChat('${data.authorUid}', '${authorName}')" class="text-[10px] text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded font-normal">💬 စာပို့</button>
                  </h4>
                  <span class="text-[10px] text-slate-400">${data.subCategory ? '#' + data.subCategory : ''}</span>
                </div>
              </div>
              <div class="flex items-center gap-1">
                ${isUserAdmin && data.status !== "hidden" ? `<button onclick="adminHidePost('${data.id}')" class="text-xs text-amber-600 font-semibold hover:underline">⚠️ ဖျောက်မည်</button>` : ''}
                ${canDelete ? `<button onclick="deletePost('${data.id}', '${data.authorUid}')" class="text-xs text-rose-500 font-semibold hover:underline">🗑️ ဖျက်မည်</button>` : ''}
              </div>
            </div>

            ${hiddenNotice}

            <h3 class="font-bold text-slate-900 text-sm">${data.title || ''}</h3>
            ${data.description ? `<p class="text-slate-600 text-xs leading-relaxed">${data.description}</p>` : ''}
            
            ${mediaTag}

            <div class="flex items-center justify-between border-t border-b py-1.5 text-xs text-slate-600 font-medium mt-2">
              <button onclick="toggleLike('${data.id}', ${JSON.stringify(likes)})" class="flex items-center gap-1 ${isLiked ? 'text-rose-500 font-bold' : ''}">
                ${isLiked ? '❤️' : '🤍'} <span>${likes.length}</span>
              </button>
              <button class="flex items-center gap-1">💬 <span>${comments.length}</span></button>
              <button onclick="sharePost('${data.title || ''}', '${data.videoUrl || data.imageUrl || ''}')" class="flex items-center gap-1 text-blue-600">↪️ ရှယ်မည်</button>
            </div>

            <div class="space-y-1.5">
              ${commentsList}
              <form onsubmit="addComment('${data.id}', event)" class="flex gap-1.5 pt-1">
                <input type="text" placeholder="ကွန်မန့်ရေးရန်..." class="flex-1 border p-1.5 rounded-lg text-xs outline-none focus:ring-1 focus:ring-blue-500">
                <button type="submit" class="bg-slate-800 text-white px-2.5 py-1 rounded-lg text-xs font-semibold">ပို့</button>
              </form>
            </div>
          </div>
        `;

        if (cat === 'feed') feedHtml += card;
        if (cat === 'reels') reelsHtml += card;
        if (cat === 'ads') paidHtml += card;
      });

      // innerHTML မှန်ကန်စွာ Assign လုပ်ပေးခြင်း
      document.getElementById('feedAds').innerHTML = feedHtml || '<p class="text-center text-slate-400 py-8 text-xs">သတင်းများ မရှိသေးပါ</p>';
      document.getElementById('reelsAds').innerHTML = reelsHtml || '<p class="text-center text-slate-400 py-8 text-xs">Reels မရှိသေးပါ</p>';
      document.getElementById('paidAds').innerHTML = paidHtml || '<p class="text-center text-slate-400 py-8 text-xs">VIP ကြော်ငြာ မရှိသေးပါ</p>';

      if (window.tiktokEmbed) window.tiktokEmbed.load();
    }

    // Actions
    function toggleLike(postId, likes) {
      if (!currentUser) return alert("Login အရင်ဝင်ပါ");
      const uid = currentUser.uid;
      const updatedLikes = likes.includes(uid) ? likes.filter(id => id !== uid) : [...likes, uid];
      db.collection("posts").doc(postId).update({ likes: updatedLikes });
    }

    function addComment(postId, e) {
      e.preventDefault();
      if (!currentUser) return alert("Login အရင်ဝင်ပါ");
      const input = e.target.querySelector('input');
      const text = input.value.trim();
      if (!text) return;

      const newComment = {
        userUid: currentUser.uid,
        userName: currentUser.displayName || 'Anonym',
        userPhoto: currentUser.photoURL || '',
        text,
        createdAt: new Date().toISOString()
      };

      db.collection("posts").doc(postId).update({
        comments: firebase.firestore.FieldValue.arrayUnion(newComment)
      }).then(() => input.value = "");
    }

    function deletePost(postId, authorUid) {
      if (!currentUser) return;
      if (currentUser.uid !== authorUid && !isUserAdmin) return alert("ဖျက်ပိုင်ခွင့်မရှိပါ");
      if (confirm("ဒီပို့စ်ကို ဖျက်မှာ သေချာပါသလား?")) {
        db.collection("posts").doc(postId).delete();
      }
    }

    function adminHidePost(postId) {
      const reason = prompt("ဖျောက်ရသည့် အကြောင်းအရင်း ရေးပါ:", "စံနှုန်းများနှင့် မညီညွတ်ပါ");
      if (reason) {
        db.collection("posts").doc(postId).update({
          status: "hidden",
          hideReason: reason
        });
      }
    }

    function sharePost(title, url) {
      if (navigator.share) {
        navigator.share({ title: title, url: url || window.location.href });
      } else {
        navigator.clipboard.writeText(url || window.location.href);
        alert("Link ကို Copy ကူးလိုက်ပါပြီ");
      }
    }

    // DM Logic
    function openDirectChat(targetUid, targetName) {
      if (!currentUser) return alert("Login အရင်ဝင်ပါ");
      if (targetUid === currentUser.uid) return alert("မိမိကိုယ်တိုင် စာပို့၍ မရပါ");
      activeChatUid = targetUid;
      document.getElementById('chatTargetName').innerText = `@${targetName}`;
      document.getElementById('chatModal').classList.remove('hidden');
      loadChatMessages();
    }

    function closeChatModal() {
      document.getElementById('chatModal').classList.add('hidden');
      activeChatUid = null;
    }

    function sendDirectMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !activeChatUid) return;

      db.collection("messages").add({
        senderUid: currentUser.uid,
        receiverUid: activeChatUid,
        text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => input.value = "");
    }

    function loadChatMessages() {
      if (!currentUser || !activeChatUid) return;
      
      db.collection("messages")
        .orderBy("createdAt", "asc")
        .onSnapshot(snapshot => {
          let chatHtml = "";
          snapshot.forEach(doc => {
            const msg = doc.data();
            const isMe = msg.senderUid === currentUser.uid;
            const isBetweenUs = (msg.senderUid === currentUser.uid && msg.receiverUid === activeChatUid) ||
                              (msg.senderUid === activeChatUid && msg.receiverUid === currentUser.uid);

            if (isBetweenUs) {
              chatHtml += `
                <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                  <div class="${isMe ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-800'} p-2 rounded-xl max-w-[80%] break-words">
                    ${msg.text}
                  </div>
                </div>
              `;
            }
          });
          const box = document.getElementById('chatMessages');
          box.innerHTML = chatHtml || '<p class="text-center text-slate-400">စကားပြောဆိုမှု မရှိသေးပါ</p>';
          box.scrollTop = box.scrollHeight;
        });
    }

    // Appeals Logic
    function openAppealModal(postId) {
      activeAppealPostId = postId;
      document.getElementById('appealModal').classList.remove('hidden');
    }

    function closeAppealModal() {
      document.getElementById('appealModal').classList.add('hidden');
      activeAppealPostId = null;
    }

    function submitAppeal() {
      const reason = document.getElementById('appealReason').value;
      if (!reason || !activeAppealPostId) return alert("အကြောင်းပြချက် ဖြည့်သွင်းပါ");

      db.collection("appeals").add({
        postId: activeAppealPostId,
        userUid: currentUser.uid,
        reason,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("အယူခံလွှာ ပို့ပြီးပါပြီ။ Admin မကြာမီ စစ်ဆေးပေးပါမည်။");
        closeAppealModal();
      });
    }
  </script>
</body>
</html>
