  <!-- Firebase SDKs -->

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCowS-0LHle_7CniEU3VVLxSvBx9HX-9D8",
      authDomain: "kyawngar-pro.firebaseapp.com",
      databaseURL: "https://kyawngar-pro-default-rtdb.firebaseio.com",
      projectId: "kyawngar-pro",
      storageBucket: "kyawngar-pro.firebasestorage.app",
      messagingSenderId: "640411826581",
      appId: "1:640411826581:web:e95bfa58b7b2f93085de9c",
      measurementId: "G-K19H2V1KC6"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentUser = null;
    let allAdsCache = [];
    let currentSearchQuery = "";
    let activeTag = "all";

    // --- Toast Notification ---
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3000);
    }

    // --- Image Compression Engine (ဖိုင်ဆိုက်ချုံ့ပေးသည့် စနစ်) ---
    function compressImage(file, maxWidth = 1000, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error("Image compression error"));
              }
            }, 'image/jpeg', quality);
          };
        };
        reader.onerror = (error) => reject(error);
      });
    }

    // --- Modal Auth Controls ---
    const authModal = document.getElementById('authModal');
    const openAuthModalBtn = document.getElementById('openAuthModalBtn');
    const closeAuthModalBtn = document.getElementById('closeAuthModalBtn');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const emailLoginBtn = document.getElementById('emailLoginBtn');
    const emailSignUpBtn = document.getElementById('emailSignUpBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userInfo = document.getElementById('userInfo');
    const userImg = document.getElementById('userImg');
    const uploadBtn = document.getElementById('uploadBtn');
    const loginWarning = document.getElementById('loginWarning');
    const authStatus = document.getElementById('authStatus');

    openAuthModalBtn.addEventListener('click', () => authModal.classList.remove('hidden'));
    closeAuthModalBtn.addEventListener('click', () => authModal.classList.add('hidden'));

    function showAuthStatus(msg, isError = false) {
      authStatus.className = `text-center text-[11px] block p-2 rounded ${isError ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}`;
      authStatus.innerText = msg;
    }

    googleLoginBtn.addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
        authModal.classList.add('hidden');
        showToast("Google Account ဖြင့် အောင်မြင်စွာ Login ဝင်လိုက်ပါပြီ");
      } catch (err) {
        showAuthStatus("Google Login အမှား: " + err.message, true);
      }
    });

    emailLoginBtn.addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      if (!email || !password) return showAuthStatus("Email နှင့် Password ဖြည့်ပါ", true);

      try {
        await auth.signInWithEmailAndPassword(email, password);
        authModal.classList.add('hidden');
        showToast("Login ဝင်ရောက်မှု အောင်မြင်ပါသည်။");
      } catch (err) {
        showAuthStatus("Login မှားယွင်းမှု: " + err.message, true);
      }
    });

    emailSignUpBtn.addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      if (!email || !password) return showAuthStatus("Email နှင့် Password ဖြည့်ပါ", true);

      try {
        await auth.createUserWithEmailAndPassword(email, password);
        showAuthStatus("အကောင့်အောင်မြင်စွာ ဖွင့်ပြီးပါပြီ!");
        showToast("အကောင့်သစ် ဖွင့်လှစ်ခြင်း အောင်မြင်သည်");
        setTimeout(() => authModal.classList.add('hidden'), 1000);
      } catch (err) {
        showAuthStatus("အကောင့်ဖွင့်ခြင်း အမှား: " + err.message, true);
      }
    });

    logoutBtn.addEventListener('click', () => {
      auth.signOut();
      showToast("အကောင့်မှ ထွက်လိုက်ပါပြီ");
    });

    // Custom Profile Photo Upload With Compressor
    const changeProfileBtn = document.getElementById('changeProfileBtn');
    const profileFileInput = document.getElementById('profileFileInput');

    changeProfileBtn.addEventListener('click', () => profileFileInput.click());

    profileFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !currentUser) return;

      showToast("Profile ဓာတ်ပုံ ချုံ့၍ တင်နေပါသည်...");

      try {
        // Compress profile photo before uploading
        const compressedBlob = await compressImage(file, 400, 0.8);
        const storageRef = storage.ref(`profiles/${currentUser.uid}_${Date.now()}.jpg`);
        const snapshot = await storageRef.put(compressedBlob);
        const photoURL = await snapshot.ref.getDownloadURL();

        await currentUser.updateProfile({ photoURL: photoURL });
        userImg.src = photoURL;
        showToast("Profile ဓာတ်ပုံ အောင်မြင်စွာ ပြောင်းလဲပြီးပါပြီ!");
        renderAdsData(allAdsCache);
      } catch (err) {
        showToast("ဓာတ်ပုံ တင်ရာတွင် အမှားရှိပါသည်: " + err.message);
      }
    });

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (user) {
        openAuthModalBtn.classList.add('hidden');
        userInfo.classList.remove('hidden');
        userImg.src = user.photoURL || 'https://via.placeholder.com/40';
        userImg.title = user.displayName || user.email;
        loginWarning.classList.add('hidden');
        uploadBtn.disabled = false;
        uploadBtn.className = "w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-blue-700 transition cursor-pointer";
        uploadBtn.innerText = "တင်မည်";
      } else {
        openAuthModalBtn.classList.remove('hidden');
        userInfo.classList.add('hidden');
        loginWarning.classList.remove('hidden');
        uploadBtn.disabled = true;
        uploadBtn.className = "w-full bg-slate-300 text-slate-500 font-bold py-2.5 rounded-lg text-sm cursor-not-allowed";
        uploadBtn.innerText = "တင်မည် (Login ဝင်ပါ)";
      }
      renderAdsData(allAdsCache);
    });

    // Navigation
    const navButtons = document.querySelectorAll('.nav-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const targetTab = btn.getAttribute('data-tab');
        tabContents.forEach(c => c.classList.add('hidden'));
        document.getElementById(`tab-${targetTab}`).classList.remove('hidden');
        navButtons.forEach(b => { b.classList.remove('text-blue-600'); b.classList.add('text-slate-500'); });
        btn.classList.remove('text-slate-500'); btn.classList.add('text-blue-600');
        window.scrollTo(0, 0);
      });
    });

    // Tag Filter
    const tagButtons = document.querySelectorAll('.tag-btn');
    tagButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        activeTag = btn.getAttribute('data-tag');
        tagButtons.forEach(b => {
          b.classList.remove('bg-blue-600', 'text-white');
          b.classList.add('bg-slate-100', 'text-slate-600');
        });
        btn.classList.remove('bg-slate-100', 'text-slate-600');
        btn.classList.add('bg-blue-600', 'text-white');
        renderAdsData(allAdsCache);
      });
    });

    // Search
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      currentSearchQuery = e.target.value.toLowerCase().trim();
      renderAdsData(allAdsCache);
    });
    document.getElementById('clearSearchBtn').addEventListener('click', () => {
      searchInput.value = "";
      currentSearchQuery = "";
      renderAdsData(allAdsCache);
    });

    function getYoutubeId(url) {
      if (!url) return null;
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function getTikTokId(url) {
      if (!url) return null;
      const match = url.match(/video\/(\d+)/);
      return match ? match[1] : null;
    }

    // Multi-media Post Upload With Image Compressor & Audio Upload
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return showToast("Login အရင်ဝင်ပါ!");

      const title = document.getElementById('adTitle').value.trim();
      const desc = document.getElementById('adDesc').value.trim();
      const cat = document.getElementById('adCat').value;
      const subCat = document.getElementById('adSubCat').value;
      const videoLink = document.getElementById('adVideoLink').value.trim();
      
      const imageFile = document.getElementById('adImageFile').files[0];
      const audioFile = document.getElementById('adAudioFile').files[0];
      const videoFile = document.getElementById('adVideoFile').files[0];
      
      const status = document.getElementById('uploadStatus');

      status.className = "text-center text-xs block bg-blue-50 text-blue-600 p-2 rounded font-semibold";
      status.innerText = "ဖိုင်များကို ပြုပြင်၍ တင်နေပါသည်... ခဏစောင့်ပါ";

      try {
        let imageUrl = "";
        let audioUrl = "";
        let directVideoUrl = "";

        // 1. Upload & Compress Image
        if (imageFile) {
          status.innerText = "ဓာတ်ပုံဆိုက်ကို ချုံ့၍ တင်နေပါသည်...";
          const compressedBlob = await compressImage(imageFile, 1000, 0.75);
          const imgRef = storage.ref(`posts/images/${Date.now()}_img.jpg`);
          const snapshot = await imgRef.put(compressedBlob);
          imageUrl = await snapshot.ref.getDownloadURL();
        }

        // 2. Upload Audio File
        if (audioFile) {
          status.innerText = "အသံဖိုင် (Audio) တင်နေပါသည်...";
          const audioRef = storage.ref(`posts/audios/${Date.now()}_${audioFile.name}`);
          const snapshot = await audioRef.put(audioFile);
          audioUrl = await snapshot.ref.getDownloadURL();
        }

        // 3. Upload Direct MP4 Video File
        if (videoFile) {
          status.innerText = "ဗီဒီယို ဖိုင် တင်နေပါသည်...";
          const videoRef = storage.ref(`posts/videos/${Date.now()}_${videoFile.name}`);
          const snapshot = await videoRef.put(videoFile);
          directVideoUrl = await snapshot.ref.getDownloadURL();
        }

        const postData = {
          title: title,
          description: desc,
          category: cat,
          subCategory: subCat,
          authorUid: currentUser.uid,
          authorName: currentUser.displayName || currentUser.email.split('@')[0],
          authorEmail: currentUser.email,
          authorPhoto: currentUser.photoURL || "",
          likes: [],
          comments: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (imageUrl) postData.imageUrl = imageUrl;
        if (audioUrl) postData.audioUrl = audioUrl;
        if (directVideoUrl) postData.directVideoUrl = directVideoUrl;
        if (videoLink) postData.videoUrl = videoLink;

        await db.collection("ads").add(postData);

        status.className = "text-center text-xs block bg-emerald-50 text-emerald-600 p-2 rounded font-semibold";
        status.innerText = "🎉 ပို့စ်ကို အောင်မြင်စွာ တင်ပြီးပါပြီ!";
        showToast("ပို့စ်အသစ် တင်ပြီးပါပြီ!");
        document.getElementById('uploadForm').reset();
      } catch (err) {
        status.className = "text-center text-xs block bg-rose-50 text-rose-600 p-2 rounded font-semibold";
        status.innerText = "❌ အမှား: " + err.message;
      }
    });

    async function deletePost(id, authorUid) {
      if (!currentUser) return showToast("Login ဝင်ထားရန် လိုအပ်ပါသည်။");
      if (currentUser.uid !== authorUid) return showToast("မိမိတင်ထားသော ပို့စ်များကိုသာ ဖျက်ပိုင်ခွင့်ရှိပါသည်။");

      if (confirm("ဒီပို့စ်ကို ဖျက်ရန် သေချာပါသလား?")) {
        try {
          await db.collection("ads").doc(id).delete();
          showToast("ပို့စ်ကို ဖျက်ပြီးပါပြီ!");
        } catch (err) {
          showToast("ဖျက်ရာတွင် အမှားရှိပါသည်: " + err.message);
        }
      }
    }

    async function toggleLike(postId, likesArray) {
      if (!currentUser) return showToast("Like ပေးရန် အကောင့်ဝင်ပါ!");
      const postRef = db.collection("ads").doc(postId);
      const uid = currentUser.uid;

      if (likesArray.includes(uid)) {
        await postRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(uid) });
      } else {
        await postRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(uid) });
      }
    }

    async function addComment(postId, e) {
      e.preventDefault();
      if (!currentUser) return showToast("Comment ရေးရန် အကောင့်ဝင်ပါ!");
      const input = e.target.querySelector('input');
      const text = input.value.trim();
      if (!text) return;

      const commentObj = {
        userName: currentUser.displayName || currentUser.email.split('@')[0],
        userPhoto: currentUser.photoURL || "",
        text: text,
        createdAt: new Date().toISOString()
      };

      await db.collection("ads").doc(postId).update({
        comments: firebase.firestore.FieldValue.arrayUnion(commentObj)
      });
      input.value = "";
    }

    function sharePost(title, url) {
      if (navigator.share) {
        navigator.share({ title: title, url: url || window.location.href });
      } else {
        navigator.clipboard.writeText(url || window.location.href);
        showToast("Post Link ကို Copy ကူးပြီးပါပြီ!");
      }
    }

    db.collection("ads").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      allAdsCache = [];
      snapshot.forEach(doc => {
        allAdsCache.push({ id: doc.id, ...doc.data() });
      });
      renderAdsData(allAdsCache);
    });

    function renderAdsData(ads) {
      let feedHtml = "", reelsHtml = "", paidHtml = "";

      const filtered = ads.filter(item => {
        const matchesSearch = !currentSearchQuery || 
          (item.title || "").toLowerCase().includes(currentSearchQuery) || 
          (item.description || "").toLowerCase().includes(currentSearchQuery);
        
        const matchesTag = (activeTag === "all") || (item.subCategory === activeTag);
        return matchesSearch && matchesTag;
      });

      filtered.forEach((data) => {
        const cat = data.category || 'feed';
        const likes = data.likes || [];
        const comments = data.comments || [];
        const isLiked = currentUser && likes.includes(currentUser.uid);

        let imageTag = "";
        let audioTag = "";
        let videoTag = "";

        // Render Image
        if (data.imageUrl) {
          imageTag = `<img src="${data.imageUrl}" class="mt-2 rounded-lg w-full max-h-80 object-cover border">`;
        }

        // Render Audio Player
        if (data.audioUrl) {
          audioTag = `
            <div class="mt-2 p-2 bg-amber-50 border border-amber-200 rounded-lg">
              <p class="text-[10px] font-semibold text-amber-800 mb-1">🎵 သီချင်း / အသံဖိုင်</p>
              <audio controls class="w-full h-8">
                <source src="${data.audioUrl}" type="audio/mpeg">
                သင့် Browser က Audio ကို မပံ့ပိုးပါ။
              </audio>
            </div>`;
        }

        // Render Video (Direct File or Links)
        if (data.directVideoUrl) {
          videoTag = `
            <div class="mt-2 rounded-lg overflow-hidden border bg-black">
              <video controls class="w-full max-h-80">
                <source src="${data.directVideoUrl}" type="video/mp4">
              </video>
            </div>`;
        } else if (data.videoUrl) {
          const ytId = getYoutubeId(data.videoUrl);
          const ttId = getTikTokId(data.videoUrl);

          if (ytId) {
            videoTag = `
              <div class="mt-2 rounded-lg overflow-hidden border bg-black aspect-video">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen></iframe>
              </div>`;
          } else if (ttId) {
            videoTag = `
              <blockquote class="tiktok-embed mt-2" cite="${data.videoUrl}" data-video-id="${ttId}" style="max-width: 100%;">
                <section></section>
              </blockquote>`;
          } else {
            videoTag = `
              <a href="${data.videoUrl}" target="_blank" class="mt-2 block p-2 bg-indigo-50 border border-indigo-100 rounded-lg text-xs text-indigo-700 truncate">
                🔗 ${data.videoUrl}
              </a>`;
          }
        }

        const authorPhoto = data.authorPhoto ? `<img src="${data.authorPhoto}" class="w-6 h-6 rounded-full object-cover">` : '<div class="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-[10px]">👤</div>';
        const canDelete = currentUser && (currentUser.uid === data.authorUid);

        let commentsList = comments.slice(-3).map(c => `
          <div class="text-[11px] bg-slate-100 p-1.5 rounded flex items-start gap-1.5">
            <img src="${c.userPhoto || 'https://via.placeholder.com/20'}" class="w-4 h-4 rounded-full mt-0.5 object-cover">
            <div><span class="font-bold text-slate-700">${c.userName}:</span> ${c.text}</div>
          </div>
        `).join('');

        const card = `
          <div class="bg-white border rounded-xl p-3 shadow-sm space-y-2">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                ${authorPhoto}
                <div>
                  <h4 class="font-bold text-slate-800 text-xs">${data.authorName || 'Unknown'}</h4>
                  <span class="text-[10px] text-slate-400">${data.subCategory ? '#' + data.subCategory : ''}</span>
                </div>
              </div>
              ${canDelete ? `<button onclick="deletePost('${data.id}', '${data.authorUid}')" class="text-xs text-rose-500 font-semibold hover:underline">🗑️ ဖျက်မည်</button>` : ''}
            </div>

            <h3 class="font-bold text-slate-900 text-sm">${data.title}</h3>
            ${data.description ? `<p class="text-slate-600 text-xs leading-relaxed">${data.description}</p>` : ''}
            
            ${imageTag}
            ${audioTag}
            ${videoTag}

            <div class="flex items-center justify-between border-t border-b py-1.5 text-xs text-slate-600 font-medium mt-2">
              <button onclick="toggleLike('${data.id}', ${JSON.stringify(likes)})" class="flex items-center gap-1 ${isLiked ? 'text-rose-500 font-bold' : ''}">
                ${isLiked ? '❤️' : '🤍'} <span>${likes.length}</span>
              </button>
              <button class="flex items-center gap-1">💬 <span>${comments.length}</span></button>
              <button onclick="sharePost('${data.title}', '${data.videoUrl || data.imageUrl || ''}')" class="flex items-center gap-1 text-blue-600">↪️ ရှယ်မည်</button>
            </div>

            <div class="space-y-1.5">
              ${commentsList}
              <form onsubmit="addComment('${data.id}', event)" class="flex gap-1.5 pt-1">
                <input type="text" placeholder="ကွန်မန့်ရေးရန်..." class="flex-1 border p-1.5 rounded-lg text-xs outline-none focus:ring-1 focus:ring-blue-500">
                <button type="submit" class="bg-slate-800 text-white px-2.5 py-1 rounded-lg text-xs font-semibold">ပို့</button>
              </form>
            </div>
          </div>
        `;

        if (cat === 'feed') feedHtml += card;
        if (cat === 'reels') reelsHtml += card;
        if (cat === 'ads') paidHtml += card;
      });

      document.getElementById('feedAds').innerHTML = feedHtml || '<p class="text-center text-slate-400 py-8 text-xs">သတင်းများ မရှိသေးပါ</p>';
      document.getElementById('reelsAds').innerHTML = reelsHtml || '<p class="text-center text-slate-400 py-8 text-xs">Reels မရှိသေးပါ</p>';
      document.getElementById('paidAds').innerHTML = paidHtml || '<p class="text-center text-slate-400 py-8 text-xs">VIP ကြော်ငြာ မရှိသေးပါ</p>';

      if (window.tiktokEmbed) window.tiktokEmbed.load();
    }

    // Chat
    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const senderName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : "ဧည့်သည်";
      const senderPhoto = currentUser ? (currentUser.photoURL || "") : "";
      const senderUid = currentUser ? currentUser.uid : "guest";

      try {
        await db.collection("chats").add({
          text: text,
          sender: senderName,
          senderPhoto: senderPhoto,
          senderUid: senderUid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
      } catch (err) {
        showToast("စာပို့ရာတွင် အမှားရှိပါသည်: " + err.message);
      }
    });

    db.collection("chats").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
      let html = "";
      snapshot.forEach(doc => {
        const c = doc.data();
        const isMe = currentUser && (currentUser.uid === c.senderUid);
        const photo = c.senderPhoto ? `<img src="${c.senderPhoto}" class="w-5 h-5 rounded-full inline object-cover">` : '';
        
        let timeStr = "";
        if (c.createdAt && c.createdAt.toDate) {
          const date = c.createdAt.toDate();
          timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        html += `
          <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
            <div class="flex items-center gap-1 text-[10px] text-slate-400 mb-0.5">
              ${!isMe ? photo : ''}
              <span class="font-bold text-slate-600">${c.sender || 'Guest'}</span>
              ${isMe ? photo : ''}
              <span class="text-[9px] text-slate-400 ml-1">${timeStr}</span>
            </div>
            <div class="p-2 rounded-xl text-xs max-w-[80%] ${isMe ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border text-slate-800 rounded-tl-none'}">
              ${c.text}
            </div>
          </div>
        `;
      });
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = html || '<p class="text-center text-slate-400 text-xs">စကားပြောဆိုမှု မရှိသေးပါ</p>';
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
