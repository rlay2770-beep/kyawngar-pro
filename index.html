<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KyawNgar Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans pb-20">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-lg font-bold">🚀 KyawNgar Pro</h1>
    <span id="userBadge" class="text-xs bg-amber-400 text-black px-2.5 py-1 rounded-full font-bold">Public Mode</span>
  </header>

  <!-- Search Bar -->
  <div class="p-3 bg-white border-b sticky top-[57px] z-40 shadow-sm">
    <div class="max-w-md mx-auto flex gap-2">
      <input type="text" id="searchInput" placeholder="ရှာဖွေရန် စာသား ရိုက်ပါ..." class="flex-1 border p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
      <button id="clearSearchBtn" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-xs font-bold">ဖျက်ရန်</button>
    </div>
  </div>

  <!-- Main Content Areas -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

    <!-- Tab 1: Feed -->
    <div id="tab-feed" class="tab-content space-y-4">
      <h2 class="text-base font-bold text-slate-800 border-b pb-2 flex justify-between items-center">
        <span>📰 သတင်းစင် & ဗီဒီယိုများ</span>
        <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-semibold">Feed</span>
      </h2>
      <div id="feedAds" class="space-y-4">
        <p class="text-center text-slate-400 py-6 text-sm">Data များကို ယူနေပါသည်...</p>
      </div>
    </div>

    <!-- Tab 2: Reels -->
    <div id="tab-reels" class="tab-content space-y-4 hidden">
      <h2 class="text-base font-bold text-slate-800 border-b pb-2 flex justify-between items-center">
        <span>🎬 Reels ဗီဒီယိုများ</span>
        <span class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded font-semibold">Reels</span>
      </h2>
      <div id="reelsAds" class="space-y-4">
        <p class="text-center text-slate-400 py-6 text-sm">Reels များ မရှိသေးပါ။</p>
      </div>
    </div>

    <!-- Tab 3: Ads -->
    <div id="tab-ads" class="tab-content space-y-4 hidden">
      <h2 class="text-base font-bold text-slate-800 border-b pb-2 flex justify-between items-center">
        <span>🏷️ VIP ကြော်ငြာများ</span>
        <span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded font-semibold">VIP</span>
      </h2>
      <div id="paidAds" class="space-y-4">
        <p class="text-center text-slate-400 py-6 text-sm">ကြော်ငြာများ မရှိသေးပါ။</p>
      </div>
    </div>

    <!-- Tab 4: Chat -->
    <div id="tab-chat" class="tab-content space-y-4 hidden">
      <h2 class="text-base font-bold text-slate-800 border-b pb-2">💬 စကားပြောရန်</h2>
      <div class="bg-white p-4 rounded-xl shadow border flex flex-col h-[420px]">
        <div id="chatBox" class="flex-1 overflow-y-auto space-y-2 mb-3 p-2 bg-slate-50 rounded text-sm">
          <p class="text-center text-slate-400 text-xs">စကားပြောဆိုမှု မရှိသေးပါ။</p>
        </div>
        <form id="chatForm" class="flex gap-2">
          <input type="text" id="chatInput" placeholder="စာရိုက်ပါ..." required class="flex-1 border p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">ပို့မည်</button>
        </form>
      </div>
    </div>

    <!-- Tab 5: Admin Panel -->
    <div id="tab-admin" class="tab-content space-y-4 hidden">
      <div class="bg-white rounded-xl shadow p-4 border space-y-3">
        <h2 class="text-base font-bold text-slate-800 border-b pb-2">⚙️ ပို့စ် / ကြော်ငြာ အသစ်တင်ရန်</h2>
        <form id="uploadForm" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ခေါင်းစဉ်</label>
            <input type="text" id="adTitle" required placeholder="ခေါင်းစဉ် ရေးပါ..." class="w-full border p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">အသေးစိတ်</label>
            <textarea id="adDesc" rows="3" placeholder="အသေးစိတ် ရေးပါ..." class="w-full border p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ကဏ္ဍ ရွေးရန်</label>
            <select id="adCat" class="w-full border p-2 rounded-lg text-sm bg-white outline-none">
              <option value="feed">📰 သတင်းစင် (Feed)</option>
              <option value="reels">🎬 Reels ဗီဒီယို</option>
              <option value="ads">🏷️ VIP ကြော်ငြာ</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">🔗 YouTube / TikTok Link</label>
            <input type="url" id="adVideoLink" placeholder="https://..." class="w-full border p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button type="submit" id="uploadBtn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-blue-700 transition">တင်မည်</button>
        </form>
        <div id="uploadStatus" class="text-center text-xs hidden p-2 rounded"></div>
      </div>
    </div>

  </main>

  <!-- Navigation Bar -->
  <nav class="bg-white border-t fixed bottom-0 left-0 right-0 flex justify-around py-2 shadow-lg z-50 text-[11px] font-semibold text-slate-500">
    <button type="button" data-tab="feed" class="nav-btn text-blue-600 flex flex-col items-center flex-1"><span>📰</span>သတင်းစင်</button>
    <button type="button" data-tab="reels" class="nav-btn flex flex-col items-center flex-1"><span>🎬</span>Reels</button>
    <button type="button" data-tab="ads" class="nav-btn flex flex-col items-center flex-1"><span>🏷️</span>ကြော်ငြာ</button>
    <button type="button" data-tab="chat" class="nav-btn flex flex-col items-center flex-1"><span>💬</span>Chat</button>
    <button type="button" data-tab="admin" class="nav-btn flex flex-col items-center flex-1"><span>⚙️</span>Admin</button>
  </nav>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // ✅ ဆရာ့ရဲ့ Firebase Config အသစ် (kyawngar-pro)
    const firebaseConfig = {
      apiKey: "AIzaSyCowS-0LHle_7CniEU3VVLxSvBx9HX-9D8",
      authDomain: "kyawngar-pro.firebaseapp.com",
      databaseURL: "https://kyawngar-pro-default-rtdb.firebaseio.com",
      projectId: "kyawngar-pro",
      storageBucket: "kyawngar-pro.firebasestorage.app",
      messagingSenderId: "640411826581",
      appId: "1:640411826581:web:e95bfa58b7b2f93085de9c",
      measurementId: "G-K19H2V1KC6"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Tab Navigation
    const navButtons = document.querySelectorAll('.nav-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const targetTab = btn.getAttribute('data-tab');
        tabContents.forEach(content => content.classList.add('hidden'));
        document.getElementById(`tab-${targetTab}`).classList.remove('hidden');
        navButtons.forEach(b => { b.classList.remove('text-blue-600'); b.classList.add('text-slate-500'); });
        btn.classList.remove('text-slate-500'); btn.classList.add('text-blue-600');
        window.scrollTo(0, 0);
      });
    });

    // Search Engine
    const searchInput = document.getElementById('searchInput');
    let currentSearchQuery = "";
    let allAdsCache = [];

    searchInput.addEventListener('input', (e) => {
      currentSearchQuery = e.target.value.toLowerCase().trim();
      renderAdsData(allAdsCache);
    });

    document.getElementById('clearSearchBtn').addEventListener('click', () => {
      searchInput.value = "";
      currentSearchQuery = "";
      renderAdsData(allAdsCache);
    });

    // YouTube URL Extractor Helper
    function getYoutubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Post Delete Function
    async function deletePost(id) {
      if (confirm("ဒီပို့စ်ကို ဖျက်ရန် သေချာပါသလား?")) {
        try {
          await db.collection("ads").doc(id).delete();
          alert("ပို့စ်ကို ဖျက်ပြီးပါပြီ!");
        } catch (err) {
          alert("ဖျက်ရာတွင် အမှားရှိပါသည်: " + err.message);
        }
      }
    }

    // Upload Post System
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('adTitle').value.trim();
      const desc = document.getElementById('adDesc').value.trim();
      const cat = document.getElementById('adCat').value;
      const videoLink = document.getElementById('adVideoLink').value.trim();
      const status = document.getElementById('uploadStatus');

      status.className = "text-center text-xs block bg-blue-50 text-blue-600 p-2 rounded font-semibold";
      status.innerText = "တင်နေပါသည်... ခဏစောင့်ပါ";

      try {
        const postData = {
          title: title,
          description: desc,
          category: cat,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (videoLink) postData.mediaUrl = videoLink;

        await db.collection("ads").add(postData);

        status.className = "text-center text-xs block bg-emerald-50 text-emerald-600 p-2 rounded font-semibold";
        status.innerText = "🎉 အောင်မြင်စွာ တင်ပြီးပါပြီ!";
        document.getElementById('uploadForm').reset();
      } catch (err) {
        status.className = "text-center text-xs block bg-rose-50 text-rose-600 p-2 rounded font-semibold";
        status.innerText = "❌ အမှား: " + err.message;
      }
    });

    // Fetch Posts from Firebase
    db.collection("ads").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      allAdsCache = [];
      snapshot.forEach(doc => {
        allAdsCache.push({ id: doc.id, ...doc.data() });
      });
      renderAdsData(allAdsCache);
    }, (error) => {
      console.error("Firestore Error: ", error);
    });

    function renderAdsData(ads) {
      let feedHtml = "", reelsHtml = "", paidHtml = "";

      const filtered = ads.filter(data => {
        if (!currentSearchQuery) return true;
        const titleMatch = (data.title || "").toLowerCase().includes(currentSearchQuery);
        const descMatch = (data.description || "").toLowerCase().includes(currentSearchQuery);
        return titleMatch || descMatch;
      });

      filtered.forEach((data) => {
        const cat = data.category || 'feed';
        let mediaTag = "";

        if (data.mediaUrl) {
          const ytId = getYoutubeId(data.mediaUrl);
          if (ytId) {
            mediaTag = `
              <div class="mt-2 rounded-lg overflow-hidden border bg-black aspect-video">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen></iframe>
              </div>
            `;
          } else {
            mediaTag = `
              <div class="mt-2 p-2.5 bg-indigo-50 border border-indigo-100 rounded-lg flex items-center justify-between">
                <span class="text-xs text-indigo-900 font-medium truncate flex-1 mr-2">🔗 ${data.mediaUrl}</span>
                <a href="${data.mediaUrl}" target="_blank" class="bg-indigo-600 text-white font-semibold text-xs px-3 py-1 rounded hover:bg-indigo-700 transition">
                  ဖွင့်ရန်
                </a>
              </div>
            `;
          }
        }

        const card = `
          <div class="bg-white border rounded-xl p-3 shadow-sm space-y-2">
            <div class="flex justify-between items-start">
              <h3 class="font-bold text-slate-800 text-sm">${data.title}</h3>
              <button onclick="deletePost('${data.id}')" class="text-xs text-rose-500 font-semibold hover:underline">🗑️ ဖျက်မည်</button>
            </div>
            ${data.description ? `<p class="text-slate-600 text-xs leading-relaxed">${data.description}</p>` : ''}
            ${mediaTag}
          </div>
        `;

        if (cat === 'feed') feedHtml += card;
        if (cat === 'reels') reelsHtml += card;
        if (cat === 'ads') paidHtml += card;
      });

      document.getElementById('feedAds').innerHTML = feedHtml || '<p class="text-center text-slate-400 py-6 text-xs">သတင်းစင်တွင် ပို့စ်မရှိသေးပါ</p>';
      document.getElementById('reelsAds').innerHTML = reelsHtml || '<p class="text-center text-slate-400 py-6 text-xs">Reels မရှိသေးပါ</p>';
      document.getElementById('paidAds').innerHTML = paidHtml || '<p class="text-center text-slate-400 py-6 text-xs">VIP ကြော်ငြာ မရှိသေးပါ</p>';
    }

    // Chat System
    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      try {
        await db.collection("chats").add({
          text: text,
          sender: "ဧည့်သည်",
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
      } catch (err) {
        alert("စာပို့ရာတွင် အမှားရှိပါသည်: " + err.message);
      }
    });

    db.collection("chats").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
      let html = "";
      snapshot.forEach(doc => {
        const c = doc.data();
        html += `
          <div class="p-2 bg-white border rounded shadow-sm">
            <div class="flex justify-between text-[10px] text-slate-400 mb-0.5">
              <span class="font-bold text-blue-600">${c.sender || "Guest"}</span>
            </div>
            <p class="text-slate-800 text-xs">${c.text}</p>
          </div>
        `;
      });
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = html || '<p class="text-center text-slate-400 text-xs">စကားပြောဆိုမှု မရှိသေးပါ</p>';
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
      </html>
